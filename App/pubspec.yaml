name: sproutly
description: "Sproutly - Preschool management app for Parents, Teachers, Admins & Super Admins."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Routing
  go_router: ^17.3.0

  # Networking
  dio: ^5.7.0
  socket_io_client: ^3.0.2

  # Local Storage
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # UI & Animation
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  smooth_page_indicator: ^2.0.1
  cached_network_image: ^3.4.1

  # Data & Media
  image_picker: ^1.1.2
  file_picker: ^12.0.0-beta.7
  flutter_pdfview: ^1.3.4

  # Charts
  fl_chart: ^1.2.0

  # Utilities
  intl: ^0.20.3
  flutter_svg: ^2.0.10+1
  package_info_plus: ^10.1.0
  google_fonts: ^8.1.0
  url_launcher: ^6.3.1
  iconsax: ^0.0.8
  flutter_slidable: ^4.0.3
  razorpay_flutter: ^1.4.5
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4

# App icon generation: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  # Android adaptive icon (API 26+): solid brand-green background + sprout foreground.
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
    - assets/icon/