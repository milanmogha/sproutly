<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050b18">
<title>AVAACRON — Splash</title>
<style>
*{margin:0;box-sizing:border-box}
body{height:100dvh;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(120vmax 120vmax at 50% 42%,#12294a,#0a1730 45%,#050b18)}
.stage{position:relative;width:min(92vmin,540px);aspect-ratio:1}
.orbit{position:absolute;inset:0;overflow:visible}
.ring{stroke-dasharray:100;stroke-dashoffset:100;
  animation:draw 1.1s .25s cubic-bezier(.6,0,.3,1) forwards,dim 1s 1.8s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes dim{to{stroke-opacity:.55}}
.comet{opacity:0;animation:show .3s 1.45s forwards;filter:drop-shadow(0 0 6px #64b5f6)}
@keyframes show{to{opacity:1}}
.glow{position:absolute;inset:16%;border-radius:50%;filter:blur(12px);
  background:radial-gradient(circle,rgba(33,150,243,.38),transparent 65%);
  opacity:0;animation:show .8s .7s forwards,breathe 3s 1.6s ease-in-out infinite alternate}
@keyframes breathe{to{transform:scale(1.12)}}
.logo-wrap{position:absolute;inset:24%;border-radius:50%;overflow:hidden;z-index:2;
  transform:scale(.35);opacity:0;box-shadow:0 0 44px rgba(33,150,243,.45);
  animation:pop .9s .55s cubic-bezier(.34,1.45,.45,1) forwards}
@keyframes pop{to{transform:scale(1);opacity:1}}
.logo-wrap img{width:100%;height:100%;display:block}
.shine{position:absolute;inset:0;transform:translateX(-110%);
  background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.75) 50%,transparent 58%);
  animation:shine .9s 1.6s ease forwards}
@keyframes shine{to{transform:translateX(110%)}}
.pix{position:absolute;width:2.4%;aspect-ratio:1;background:#2196f3;border-radius:18%;
  opacity:0;transform:scale(0);z-index:2;animation:pop .45s cubic-bezier(.34,1.5,.5,1) forwards}
.loader{position:absolute;left:0;right:0;bottom:3%;display:flex;gap:10px;justify-content:center;
  opacity:0;animation:show .5s 2.1s forwards}
.loader i{width:8px;height:8px;border-radius:50%;background:#64b5f6;animation:hop 1s infinite}
.loader i:nth-child(2){animation-delay:.15s}
.loader i:nth-child(3){animation-delay:.3s}
@keyframes hop{40%{transform:translateY(-7px);opacity:.5}}
.replay{position:fixed;bottom:16px;right:16px;padding:8px 16px;cursor:pointer;
  background:#132b4d;color:#9fc6ff;border:1px solid #2d5a99;border-radius:20px;font:14px system-ui}
</style>
</head>
